# Environment for the notebook kernel: chemical standardization, logistic regression, ensembles
# and reading the embeddings that are already on disk. Only the packages the code actually
# imports are listed; transitive dependencies are left to the resolver, and the exact versions
# in use can be read with `pip freeze`.
#
# The encoders are NOT here. torch, transformers, torch_geometric, gensim, selfies and
# unimol_tools do not fit in this kernel and run in a separate conda environment named
# `embeddings`, which notebooks/embeddings_generation.ipynb creates on its own.
name: PIBIC_Luiggy
channels:
  - conda-forge
dependencies:
  - python=3.15
  - pip
  - pip:
      # Numerical core and modelling.
      - numpy==2.5.5
      - pandas==3.1.1
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - joblib==1.6.0
      - matplotlib==3.11.2
      # Chemistry: standardization (rdMolStandardize), Bemis-Murcko scaffolds, fingerprints.
      - rdkit==2026.9.2
      # Imported nowhere, and required anyway: the stored final models hold a DataFrame with an
      # arrow-backed string column, and without pyarrow joblib.load fails with
      # ModuleNotFoundError.
      - pyarrow==26.0.1
      # The notebook kernel; IPython.display.display is used in the output cells.
      - ipykernel==7.4.0
      - ipython==9.18.1
